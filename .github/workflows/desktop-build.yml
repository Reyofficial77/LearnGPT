
name: LearnGPT All Platforms

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learngpt-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # DESKTOP: WINDOWS, LINUX, MACOS
  # ==========================================
  desktop:
    name: Desktop - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            artifact: LearnGPT-Windows
          - platform: Linux
            os: ubuntu-22.04
            artifact: LearnGPT-Linux
          - platform: macOS
            os: macos-15
            artifact: LearnGPT-macOS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            patchelf \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop application
        run: npx tauri build --ci

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}-${{ github.run_number }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # ANDROID: APK + AAB
  # ==========================================
  android:
    name: Android - APK and AAB
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Configure Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install Rust Android targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project
        run: npx tauri android init --ci

      - name: Build Android APK and AAB
        run: npx tauri android build --apk --aab --ci

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: LearnGPT-Android-APK-${{ github.run_number }}
          path: src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android AAB
        uses: actions/upload-artifact@v6
        with:
          name: LearnGPT-Android-AAB-${{ github.run_number }}
          path: src-tauri/gen/android/app/build/outputs/**/*.aab
          if-no-files-found: error
          retention-days: 14

  # ==========================================
  # IOS / IPADOS SIMULATOR
  # ==========================================
  ios:
    name: iOS and iPadOS Simulator
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install iOS Rust targets
        run: |
          rustup target add \
            aarch64-apple-ios \
            x86_64-apple-ios \
            aarch64-apple-ios-sim

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install CocoaPods
        run: |
          brew install cocoapods

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS project
        run: npx tauri ios init --ci

      - name: Build iOS Simulator application
        run: npx tauri ios build --target aarch64-sim --ci

      - name: Upload iOS Simulator application
        uses: actions/upload-artifact@v6
        with:
          name: LearnGPT-iOS-iPadOS-Simulator-${{ github.run_number }}
          path: src-tauri/gen/apple/build/**/*.app
          if-no-files-found: error
          retention-days: 14
