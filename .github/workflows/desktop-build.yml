name: Build LearnGPT for All Platforms

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learngpt-multiplatform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: windows
            path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

          - name: Linux
            os: ubuntu-22.04
            artifact: linux
            path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage

          - name: macOS
            os: macos-15
            artifact: macos
            path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

      - name: Generate platform icons
        run: npx --yes @tauri-apps/cli@2 icon src-tauri/icons/icon.png

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build desktop app
        run: npx --yes @tauri-apps/cli@2 build --no-sign

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v6
        with:
          name: LearnGPT-${{ matrix.artifact }}-${{ github.run_number }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Generate Android icons
        run: npx --yes @tauri-apps/cli@2 icon src-tauri/icons/icon.png

      - name: Initialize Android project
        run: npx --yes @tauri-apps/cli@2 android init --ci

      - name: Build Android APK and AAB
        run: npx --yes @tauri-apps/cli@2 android build --apk --aab --ci

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: LearnGPT-Android-${{ github.run_number }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 30

  ios-simulator:
    name: iOS / iPadOS Simulator
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Generate iOS icons
        run: npx --yes @tauri-apps/cli@2 icon src-tauri/icons/icon.png

      - name: Initialize iOS project
        run: npx --yes @tauri-apps/cli@2 ios init --ci

      - name: Build iOS Simulator app
        run: npx --yes @tauri-apps/cli@2 ios build --target aarch64-sim --ci

      - name: Package simulator app
        run: |
          APP_PATH="$(find src-tauri/gen/apple -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" LearnGPT-iOS-Simulator.zip

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v6
        with:
          name: LearnGPT-iOS-Simulator-${{ github.run_number }}
          path: LearnGPT-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 30
